<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature Verification</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;  
            background: linear-gradient(to bottom, #00c6ff, #0072ff);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            background-image: url('{{ url_for('static', filename='new_one_image.jpg') }}');
            
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            /* background-color: hsla(58, 94%, 51%, 0.959); */
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background-image: none;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-decoration: solid;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: rgb(248, 244, 244);
        }

        input[type="file"] {
            margin-top: 20px;
            padding: 10px;
            font-size: 1rem;
            color: #000408;
            border: 2px solid #020508;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        input[type="file"]:hover {
            background-color: rgb(250, 6, 172);
            border-color: #00c6ff;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #050505;
            background-color: #0beafaf5;
            border: 2px solid black;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        }

        button:hover {
            background-color: #ff0000;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            border-color: #111212;
        }

        button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        #result {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            color: #06f812;
        }

        #accuracy {
            margin-top: 10px;
            padding-left: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #e6fe0b;
        }

        #imagePreview {
            margin-top: 20px;
            max-width: 100%;
            max-height: 400px;
            border: 2px solid #fff;
            border-radius: 10px;
            display: none;
        }

        @media screen and (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            input[type="file"],
            button {
                font-size: 0.9rem;
            }
        }

        marquee {
            color: solid rgb(136, 6, 6);
        }

        video.background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Ensures the video covers the entire background */
            z-index: -1;
            /* Puts the video behind other content */
        }

        /* Some content styling */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            /* Optional overlay to darken the video */
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding: 50px;
        }
    </style>
</head>

<body style="background-image: url('{{ url_for("static", filename="new_one_image.jpg") | safe }}');">
    <!-- <!-- Video background -->
    <!-- <video class="background-image" autoplay muted loop>
        <source src="{{ url_for('static', filename='background.webp') }}" type="video/quicktime">
    </video> --> -->
<img src="{{ url_for('static', filename='new_one_image/new_one_image.jpg') }}" alt="Background">
    <b>
        <h1>
            <marquee right style="color: red;">
                !! Welcome To Signature Verification System !!
            </marquee>
        </h1>
    </b>
    <div class="container">
        <b>
            <h1>Signature Verification</h1>
        </b>
        <form id="predict" method="post" enctype="multipart/form-data">
            <input type="file" name="file" id="signatureInput" required>
            <button type="submit" id="uploadButton">Upload Signature</button>
            <div id="user_id"></div>
            <div id="result">
            </div>
            <div id="accuracy">
            </div>
            <img id="imagePreview" src="" alt="Selected Image Preview">
        </form>
    </div>

    <script>
        document.getElementById('signatureInput').addEventListener('change', function (event) {
            const file = event.target.files[0];
            const preview = document.getElementById('imagePreview');

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block'; // Show the image preview
                };
                reader.readAsDataURL(file);
            }
        });

        // Prevent the form submission and handle via AJAX
        document.getElementById('predict').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent the default form submission

            const fileInput = document.getElementById('signatureInput');
            const resultDiv = document.getElementById('result');
            const accuracyDiv = document.getElementById('accuracy');

            resultDiv.innerText = ''; // Clear previous result
            accuracyDiv.innerText = ''; // Clear previous accuracy

            if (!fileInput.files.length) {
                resultDiv.innerText = 'Please select a signature image.';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            resultDiv.innerText = 'Verifying...';

            try {
                const response = await fetch('/verify', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const result = await response.json();

                // if (result.error) {
                //     resultDiv.innerText = `Error: ${result.error}`;
                // } else {
                //     resultDiv.innerText = `The Given signature is: ${result.result}`;
                //     accuracyDiv.innerText = `Model Accuracy is: ${result.accuracy}%`;
                // }
                if (result.error) {
                    resultDiv.innerText = `Error: ${result.error}`;
                } else {
                    resultDiv.innerText = `User: ${result.user}, Signature is: ${result.result}`;
                    accuracyDiv.innerText = `Model Accuracy: ${result.accuracy}%`;
                }

            } catch (error) {
                resultDiv.innerText = 'Error verifying the signature.';
                console.error('Error:', error);
            }
        });
    </script>
</body>

</html>
